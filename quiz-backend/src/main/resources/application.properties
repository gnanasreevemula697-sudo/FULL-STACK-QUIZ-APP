spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:quizdb}?createDatabaseIfNotExist=true}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8085}

# Admin credentials (set via environment variables or application-local.properties)
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
